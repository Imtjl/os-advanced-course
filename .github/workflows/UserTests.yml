name: UserTests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vityamand/xv6:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show the MR info
        run: |
          echo "Target branch: '$GITHUB_BASE_REF'"
          echo "Source branch: '$GITHUB_HEAD_REF'"

      - name: Build
        run: cd xv6-os && make && make fs.img

      - name: Test Lab 1
        if: ${{ github.head_ref == 'lab-1' }}
        run: sh ./xv6-os/ci/test/run.sh dumptests dump2tests usertests
      
      - name: Test Lab 2
        if: ${{ github.head_ref == 'lab-2' }}
        run: sh ./xv6-os/ci/test/run.sh alloctest usertests

      - name: Test Lab 3
        if: ${{ github.head_ref == 'lab-3' }}
        run: sh ./xv6-os/ci/test/run.sh cowtest usertests

      - name: Test Lab 3 Lazy
        if: ${{ github.head_ref == 'lab-3-lazy' }}
        run: sh ./xv6-os/ci/test/run.sh lazytests usertests

      - name: Test Basic
        if: ${{ ! startsWith(github.head_ref, 'lab-') }}
        run: sh ./xv6-os/ci/test/run.sh usertests
