name: PreventTestsChanges

on:
  pull_request:
    paths:
      - ./xv6-os/user/alloctest.c
      - ./xv6-os/user/cowtest.c
      - ./xv6-os/user/dump2tests.c
      - ./xv6-os/user/dumptests.c
      - ./xv6-os/user/dump2tests.S
      - ./xv6-os/user/dumptests.S
      - ./xv6-os/user/forktest.c
      - ./xv6-os/user/lazytests.c
      - ./xv6-os/user/usertests.c

jobs:
    prevent-edit-test:
      runs-on: ubuntu-latest
      steps:
        - name: Fail Action
          uses: actions/github-script@v7
          with:
            script: |
              core.setFailed('You shall not edit tests with no reason!')
  
